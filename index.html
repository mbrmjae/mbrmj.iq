<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/mbrmj-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>برنامج Mbrmj | محاكاة بيئة العمل البرمجية</title>
    <meta name="description" content="برنامج تطبيقي لمدة أسبوعين يحاكي انضمامك إلى مشروع برمجي قائم لتطوير الميزات، إصلاح الأخطاء، اختبار الحلول، وعرض المنتج." />
    
    <!-- Open Graph Metadata -->
    <meta property="og:title" content="برنامج Mbrmj | محاكاة بيئة العمل البرمجية" />
    <meta property="og:description" content="برنامج تطبيقي لمدة أسبوعين يحاكي انضمامك إلى مشروع برمجي قائم لتطوير الميزات، إصلاح الأخطاء، اختبار الحلول، وعرض المنتج." />
    <meta property="og:type" content="website" />
    
    <meta name="theme-color" content="#1b3250" />

    <!-- Preconnect for faster font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Load fonts asynchronously to prevent render blocking -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap"></noscript>

    <!-- Prevent blank white page while JS bundle loads -->
    <style>
      #root:empty::before {
        content: '';
        display: block;
        position: fixed;
        inset: 0;
        background: #1b3250;
        z-index: 9999;
      }
      #root:empty::after {
        content: '';
        display: block;
        position: fixed;
        top: 50%;
        left: 50%;
        width: 48px;
        height: 48px;
        margin: -24px 0 0 -24px;
        border: 4px solid rgba(103, 202, 173, 0.3);
        border-top-color: #67caad;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        z-index: 10000;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
